<app-layout [withBackButton]="true" (backButtonAction)="returnToHome()">
    <ng-container role="header">
        <span class="title">Partie en cours</span>
    </ng-container>

    <ng-container role="body">

        <div class="game"
            [ngStyle]="{'background': 'linear-gradient(rgba(255,255,255,.9), rgba(255,255,255,.4)), url(' + (matchState | async)?.match!.game.imageUrl + ') no-repeat top / cover'}">
            <div class="heading">{{ (matchState | async)?.match!.game.title }}</div>

            <ul class="game-category">
                <li *ngFor="let matchCategory of (matchState | async)?.match!.choosenTags; let i = index">
                    {{matchCategory.category}}: <span class="value">{{matchCategory.names.join(', ')}}</span>
                </li>
            </ul>

            <div class="pending-tags" *ngIf="!editing && deferredMatchTags((matchState | async)!.match!).length > 0">
                <button mat-stroked-button *ngFor="let tag of deferredMatchTags((matchState | async)!.match!)"
                    (click)="startEdit()">
                    <mat-icon>visibility</mat-icon> Renseigner : {{ tag.category }}
                </button>
            </div>

            <div class="elapsedtime">
                Temps écoulé :<br />
                <span class="bold">{{ elapsedTime }}</span>
            </div>

            <div class="edit-actions" *ngIf="!editing">
                <button mat-stroked-button (click)="startEdit()">
                    <mat-icon>edit</mat-icon> Modifier
                </button>
            </div>

            <div class="edit-actions" *ngIf="editing">
                <button mat-stroked-button (click)="cancelEdit()">Annuler</button>
                <button mat-raised-button color="primary" (click)="saveEdit()">Valider</button>
            </div>

            <div class="edit-panel" *ngIf="editing">
                <div *ngIf="((matchState | async)?.match!.game?.matchTags?.length ?? 0) > 0">
                    <h3>Catégories du match</h3>
                    <div class="list-tag-container">
                        <game-tags-selection [saving]="saving" />
                    </div>
                </div>

                <h3>Joueurs</h3>
                <div *ngFor="let teamIndex of order; let position = index; trackBy: trackByIndex" class="edit-team">
                    <div class="edit-team-header">
                        <span class="edit-team-name">{{ (matchState | async)!.match!.teams[teamIndex].name }}</span>
                        <button mat-icon-button [disabled]="position == 0" (click)="move(position, -1)">
                            <mat-icon>arrow_upward</mat-icon>
                        </button>
                        <button mat-icon-button [disabled]="position == order.length - 1" (click)="move(position, 1)">
                            <mat-icon>arrow_downward</mat-icon>
                        </button>
                    </div>
                    <div class="list-tag-container"
                        *ngIf="((matchState | async)?.match!.game?.playerTags?.length ?? 0) > 0">
                        <team-tags-selection [teamIndex]="teamIndex" [saving]="saving"
                            [teamChoosenTags]="teamChoosenTags" />
                    </div>
                </div>
            </div>

            <div class="player-list" *ngIf="!editing">
                <div *ngFor="let team of (matchState | async)?.match!.teams; let i = index" (click)="goToTeamDetail(team)">
                    <div class="row">
                        <div class="column">
                            <div class="player">
                                <div class="avatar">
                                    <img src="{{team.teamPlayers[0].player.gravatarUrl}}">
                                </div>
                                <div class="line">
                                    <div class="pseudo">
                                        {{team.name}}
                                        <div class="color">
                                            <span [hidden]="team.color.name == 'Aucune'">
                                                <span class="dot"
                                                    [ngStyle]="{'background-color': team.color.code, 'color': team.color.invert}"></span>
                                            </span>
                                        </div>
                                    </div>
                                    <div class="pending-tags" *ngIf="deferredTeamTags((matchState | async)!.match!).length > 0">
                                        <button mat-stroked-button
                                            *ngFor="let tag of deferredTeamTags((matchState | async)!.match!)"
                                            (click)="$event.stopPropagation(); startEdit()">
                                            <mat-icon>visibility</mat-icon> Renseigner : {{ tag.category }}
                                        </button>
                                    </div>
                                    <div class="tags">
                                        <ul *ngFor="let tag of team.choosenTags">
                                            <li>{{tag.category}}: <span class="tag-value">{{tag.names}}</span></li>
                                        </ul>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="elapsedtime" *ngIf="!editing">
                <button mat-raised-button (click)="endGame()">
                    Cliquer ici pour mettre fin à la partie
                </button>
            </div>

        </div>
    </ng-container>

</app-layout>
