<mat-form-field appearance="fill">
    <mat-label>{{ title }}</mat-label>
    <mat-chip-grid #chipGridTag aria-label="Ajouter des tags">
        <mat-chip-row *ngFor="let tag of tags" [removable]="!readonly" (removed)="removeTag(tag)" [ngStyle]="{'background-color': tag.code}">
            <span [ngStyle]="{'color': tag.invert}">{{tag.name}}</span>
            @if (!readonly) {
                <button type="button" matChipRemove [attr.aria-label]="'Supprimer ' + tag.name">
                    <mat-icon>cancel</mat-icon>
                </button>
            }
        </mat-chip-row>
        
        <input [matChipInputFor]="chipGridTag" disabled="true" />
            
    </mat-chip-grid>
    
</mat-form-field>

@if (!readonly) {
    <button type="button" mat-mini-fab class="color-add" (click)="addColorTag()" aria-label="Ajouter une couleur">
        <mat-icon>add</mat-icon>
    </button>
}
