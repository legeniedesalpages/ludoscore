<mat-form-field appearance="fill">
    <mat-label>{{ title }}</mat-label>
    <mat-chip-grid #chipGridTag aria-label="Ajouter des tags">
        <mat-chip-row *ngFor="let tag of tags" (removed)="removeTag(tag)" [removable]="baseGameBggId === undefined"
            [editable]="false" (click)="editTag(tag)" (keydown.enter)="editTag(tag)"
            [attr.aria-label]="baseGameBggId === undefined ? null : 'Modifier les valeurs de ' + tag.category">
            {{tag.category}}{{ changeFor(tag) ? ' (modifié)' : '' }}
            @if (baseGameBggId === undefined) {
                <button type="button" matChipRemove [attr.aria-label]="'Supprimer ' + tag.category" (click)="$event.stopPropagation()">
                    <mat-icon>cancel</mat-icon>
                </button>
            }
        </mat-chip-row>

        <input [matChipInputFor]="chipGridTag" disabled="true" />

    </mat-chip-grid>
</mat-form-field>

@if (baseGameBggId === undefined) {
    <button type="button" mat-mini-fab class="tag-add" (click)="addTag()" aria-label="Ajouter un tag">
        <mat-icon>add</mat-icon>
    </button>
}
